    .booking-button {
  display: inline-block;
  font-size: 18px;
  padding: 12px 24px;
  border-radius: 8px;
  text-decoration: none;
  background-color: white;
  color: black;
  cursor: pointer;
  transition: transform 0.2s ease;
}

.booking-button:hover {
  transform: scale(1.05);
}

    #booking-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }
    #booking-overlay.open { display: flex; }
    #booking-modal {
      background: #fff;
      color: #222;
      border-radius: 12px;
      padding: 28px;
      max-width: 640px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      text-align: left;
      position: relative;
      font-family: Arial, sans-serif;
    }
    #booking-modal h2 {
      font-size: 22px;
      margin: 0 0 18px 0;
    }
    #booking-close {
      position: absolute;
      top: 14px; right: 18px;
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #444;
      padding: 0;
    }
    .booking-row {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .booking-field { flex: 1; min-width: 220px; }
    .booking-field label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 6px;
      color: #222;
    }
    .booking-field label .req { color: #e0302d; }
    .booking-field input,
    .booking-field select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      color: #333;
      background: #fff;
    }
    .booking-dob { display: flex; gap: 8px; }
    .booking-dob select { flex: 1; }
    #booking-submit {
      margin-top: 8px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
    }
    #booking-submit:hover { opacity: 0.85; }

    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      overflow: hidden;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #progress-bar {
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(16px, 3vw, 34px);
      color: #33ccff;
      white-space: pre;
      text-shadow: 0 0 10px rgba(51, 204, 255, 0.8);
      z-index: 2;
    }

    #spinner-line {
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(14px, 2.2vw, 24px);
      color: #66eaff;
      margin-top: 18px;
      letter-spacing: 4px;
      z-index: 2;
    }

    #matrix-rain {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #bottom-glow {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70%;
      background: linear-gradient(to top, rgba(160, 160, 160, 0.55) 0%, rgba(160, 160, 160, 0.25) 35%, rgba(160, 160, 160, 0) 100%);
      z-index: 1;
      pointer-events: none;
    }

    #content {
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    #content.visible {
      opacity: 1;
    }
  </style>
</head>

  </div>

  <div id="booking-overlay">
    <div id="booking-modal">
      <button id="booking-close" aria-label="Close">&times;</button>
      <h2>Book an Appointment</h2>
      <form id="booking-form">
        <div class="booking-row">
          <div class="booking-field">
            <label>First Name <span class="req">*</span></label>
            <input name="First Name" type="text" placeholder="First Name" required>
          </div>
          <div class="booking-field">
            <label>Last Name <span class="req">*</span></label>
            <input name="Last Name" type="text" placeholder="Last Name" required>
          </div>
        </div>
        <div class="booking-row">
          <div class="booking-field">
            <label>Phone <span class="req">*</span></label>
            <input name="Phone" type="tel" placeholder="305-555-5555" required>
          </div>
          <div class="booking-field">
            <label>Email <span class="req">*</span></label>
            <input name="Email" type="email" placeholder="Please enter an email address" required>
          </div>
        </div>
        <div class="booking-row">
          <div class="booking-field">
            <label>Date of Birth <span class="req">*</span></label>
            <div class="booking-dob">
              <select name="Birth Month" required>
                <option value="" disabled selected>Month</option>
                <option>January</option><option>February</option><option>March</option>
                <option>April</option><option>May</option><option>June</option>
                <option>July</option><option>August</option><option>September</option>
                <option>October</option><option>November</option><option>December</option>
              </select>
              <select name="Birth Day" required>
                <option value="" disabled selected>Day</option>
                <script>for(let d=1;d<=31;d++)document.write(`<option>${d}</option>`);</script>
              </select>
              <select name="Birth Year" required>
                <option value="" disabled selected>Year</option>
                <script>for(let y=new Date().getFullYear();y>=1920;y--)document.write(`<option>${y}</option>`);</script>
              </select>
            </div>
          </div>
          <div class="booking-field">
            <label>Type of Service Requested <span class="req">*</span></label>
            <input name="Type of Service" type="text" placeholder="e.g. Consultation, Follow-up" required>
          </div>
        </div>
        <div class="booking-row">
          <div class="booking-field">
            <label>Location Preference <span class="req">*</span></label>
            <select name="Location Preference" required>

              <option>Downtown Office</option>
              <option>North Office</option>

  <script>

    document.getElementById("booking-open").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("booking-overlay").classList.add("open");
    });
    document.getElementById("booking-close").addEventListener("click", () => {
      document.getElementById("booking-overlay").classList.remove("open");
    });
    document.getElementById("booking-overlay").addEventListener("click", (e) => {
      if (e.target.id === "booking-overlay") {
        document.getElementById("booking-overlay").classList.remove("open");
      }
    });
    document.getElementById("booking-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = document.getElementById("booking-submit");
      btn.disabled = true;
      btn.textContent = "Sending...";
      try {
        const data = new FormData(form);
        data.append("_subject", "New appointment request");
        data.append("_captcha", "false");
        const res = await fetch("https://formsubmit.co/ajax/michaelsimon0098@gmail.com", {
          method: "POST",
          headers: { "Accept": "application/json" },
          body: data
        });
        if (!res.ok) throw new Error("Request failed");
        alert("Thanks! Your appointment request has been sent.");
        form.reset();
        document.getElementById("booking-overlay").classList.remove("open");
      } catch (err) {
        alert("Sorry, something went wrong. Please try again.");
      }
      btn.disabled = false;
      btn.textContent = "Submit";
    });

    window.addEventListener("load", () => {
      // --- Matrix rain background ---
      const canvas = document.getElementById("matrix-rain");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const glyphs = "日ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ0123456789✦✧⟡◇☆★";
      const fontSize = 18;
      const columns = Math.floor(canvas.width / fontSize);
      const drops = new Array(columns).fill(1);

      let rainActive = true;

      function drawRain() {
        ctx.fillStyle = "rgba(10, 10, 10, 0.08)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#33ff99";
        ctx.font = fontSize + "px monospace";

        for (let i = 0; i < drops.length; i++) {
          const text = glyphs[Math.floor(Math.random() * glyphs.length)];
          ctx.fillText(text, i * fontSize, drops[i] * fontSize);

          if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        }

        if (rainActive) requestAnimationFrame(drawRain);
      }
      drawRain();

      // --- Braille spinner ---
      const spinnerFrames = ["⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"];
      const spinnerMessages = [
        "initializing", "loading assets", "mixing colors",
        "priming confetti", "warming up", "almost there"
      ];
      let frame = 0;
      const spinnerLine = document.getElementById("spinner-line");

      const spinnerInterval = setInterval(() => {
        const glyph = spinnerFrames[frame % spinnerFrames.length];
        const msg = spinnerMessages[Math.floor(frame / 8) % spinnerMessages.length];
        spinnerLine.textContent = `${glyph} ${msg}`;
        frame++;
      }, 80);

      // --- Progress bar (terminal style) ---
      let i = 0;
      const bar = document.getElementById("progress-bar");
      const barWidth = Math.max(30, Math.min(80, Math.floor(window.innerWidth / 16)));

      const interval = setInterval(() => {
        const filled = "█".repeat(Math.floor((i / 100) * barWidth));
        const empty = "░".repeat(barWidth - Math.floor((i / 100) * barWidth));
        bar.textContent = `[${filled}${empty}] ${i}%`;

        if (i >= 100) {
          clearInterval(interval);
          clearInterval(spinnerInterval);
          rainActive = false;
          setTimeout(() => {
            document.getElementById("loading-screen").classList.add("hidden");
            document.getElementById("content").classList.add("visible");
          }, 200);
        }

        i++;
      }, 10);
    });

  </script>

</body>
</html>
