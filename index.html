<!DOCTYPE html>
<html>
<head>
<title>Hello I'm Mike</title>
<meta name="description" content="Mike is a Software Engineer. This site links to his resume and work.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root { --s: 1; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      overflow: hidden;
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }

    /* The page is the picture: a 702px blue grid panel (9 x 23 squares of 78px)
       next to a 1008px photo, both 1808px tall. --s shrinks it to fit the
       window height. It never goes above 1 (never scaled up). */
    #content { position: relative; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #pixels { position: absolute; inset: 0; width: 100%; height: 100%; }

    #stage { position: relative; display: flex; flex: none; width: calc(1710px * var(--s)); height: calc(1808px * var(--s)); }

    /* White corner marks */
    .corner {
      position: absolute; z-index: 3; pointer-events: none;
      width: calc(68px * var(--s)); height: calc(68px * var(--s));
      border: 0 solid #fff;
      --t: max(2px, calc(7px * var(--s)));
    }
    .corner.tl { top: calc(16px * var(--s)); left: calc(24px * var(--s)); border-top-width: var(--t); border-left-width: var(--t); }
    .corner.tr { top: calc(16px * var(--s)); right: calc(24px * var(--s)); border-top-width: var(--t); border-right-width: var(--t); }
    .corner.bl { bottom: calc(16px * var(--s)); left: calc(24px * var(--s)); border-bottom-width: var(--t); border-left-width: var(--t); }
    .corner.br { bottom: calc(16px * var(--s)); right: calc(24px * var(--s)); border-bottom-width: var(--t); border-right-width: var(--t); }

    #left { position: relative; overflow: hidden; flex: none; width: calc(702px * var(--s)); height: calc(1808px * var(--s)); }
    #left-content {
      position: absolute; top: 0; left: 0; z-index: 1;
      width: 702px; height: 1808px;
      transform: scale(var(--s)); transform-origin: 0 0;
    }
    #photo {
      position: relative; z-index: 1; flex: none; display: block;
      width: calc(1008px * var(--s)); height: calc(1808px * var(--s));
    }

    .booking-button {
      position: absolute; left: 73px; top: 855px; width: 557px; height: 108px;
      box-sizing: border-box; display: flex; align-items: center; justify-content: center;
      font-size: 44px; border-radius: 26px;
      background-color: #fff; color: #000; text-decoration: none; cursor: pointer;
      transition: transform 0.2s ease;
    }
    .booking-button:hover { transform: scale(1.03); }

    .services {
      position: absolute; left: 75px; top: 1018px; margin: 0; padding: 0 0 0 3px;
      list-style: none; border-left: 9px solid #fff; color: #fff;
      font-size: 33px; line-height: 44px;
    }

    .icons a {
      position: absolute; left: var(--x); top: var(--y);
      width: var(--w); height: var(--h); display: block; line-height: 0;
    }
    .icons img, .icons svg { width: 100%; height: 100%; display: block; }

    /* Phones and narrow windows: stack the blue panel on top of the photo */
    @media (max-width: 800px) {
      body { overflow: auto; }
      #content { flex-direction: column; justify-content: flex-start; align-items: stretch; height: auto; }
      #stage { display: block; width: 100%; height: auto; }
      #left { width: 100%; height: auto; }
      #left-content {
        position: relative; width: auto; height: auto; transform: none;
        box-sizing: border-box; padding: 48px 8% 32px;
      }
      .booking-button {
        position: static; width: 100%; height: auto; max-width: 640px;
        font-size: 22px; padding: 0.75em 0.5em;
      }
      .services { position: static; margin-top: 36px; font-size: 22px; line-height: 1.3; }
      .icons { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 48px; }
      .icons a { position: static; width: auto; height: auto; }
      .icons img, .icons svg { height: 40px; width: auto; }
      #photo { width: 100%; height: auto; }
    }

    #booking-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }
    #booking-overlay.open { display: flex; }
    #booking-modal {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      color: #fff;
      border-radius: 12px;
      padding: 34px 38px 38px;
      max-width: 680px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      text-align: left;
      position: relative;
      font-family: Arial, sans-serif;
    }
    #booking-modal h2 {
      font-size: 34px;
      margin: 0 0 22px 0;
    }
    #booking-close {
      position: absolute;
      top: 14px; right: 18px;
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #fff;
      padding: 0;
    }
    .booking-row {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .booking-field { flex: 1; min-width: 220px; }
    .booking-field label {
      display: block;
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 8px;
      color: #fff;
    }
    .booking-field label .req { color: #e0302d; }
    .booking-field input,
    .booking-field select {
      width: 100%;
      box-sizing: border-box;
      padding: 13px 16px;
      font-size: 17px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 12px;
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }
    .booking-field input::placeholder { color: rgba(255, 255, 255, 0.7); }
    .booking-field select option { color: #222; background: #fff; }
    .booking-dob { display: flex; gap: 8px; }
    .booking-dob select { flex: 1; }
    #booking-submit {
      margin-top: 8px;
      background: rgba(255, 255, 255, 0.9);
      color: #111;
      border: none;
      border-radius: 10px;
      padding: 14px 30px;
      font-size: 20px;
      cursor: pointer;
    }
    #booking-submit:hover { opacity: 0.85; }
    #booking-smile { margin-left: 12px; font-size: 24px; color: #fff; vertical-align: middle; }

    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      overflow: hidden;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #progress-bar {
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(16px, 3vw, 34px);
      color: #33ccff;
      white-space: pre;
      text-shadow: 0 0 10px rgba(51, 204, 255, 0.8);
      z-index: 2;
    }

    #spinner-line {
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(14px, 2.2vw, 24px);
      color: #66eaff;
      margin-top: 18px;
      letter-spacing: 4px;
      z-index: 2;
    }

    #matrix-rain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    #bottom-glow {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70%;
      background: linear-gradient(to top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.6) 35%, rgba(0, 0, 0, 0) 100%);
      z-index: 1;
      pointer-events: none;
    }

    #content {
      position: relative;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    #content.visible {
      opacity: 1;
    }

    /* Artwork pinned to the bottom-right corner of the window */
    #corner-art {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: clamp(100px, 14vw, 220px);
      height: auto;
      z-index: 5;
      pointer-events: none;
    }
  </style>
</head>

  <div id="booking-overlay">
    <div id="booking-modal">
      <button id="booking-close" aria-label="Close">&times;</button>
      <h2>Book an Appointment</h2>
      <form id="booking-form">
        <div class="booking-row">
          <div class="booking-field">
            <label>First Name <span class="req">*</span></label>
            <input name="First Name" type="text" placeholder="First Name" required>
          </div>
          <div class="booking-field">
            <label>Last Name <span class="req">*</span></label>
            <input name="Last Name" type="text" placeholder="Last Name" required>
          </div>
        </div>
        <div class="booking-row">
          <div class="booking-field">
            <label>Phone <span class="req">*</span></label>
            <input name="Phone" type="tel" placeholder="305-555-5555" required>
          </div>
          <div class="booking-field">
            <label>Email <span class="req">*</span></label>
            <input name="Email" type="email" placeholder="Please enter an email address" required>
          </div>
        </div>
        <div class="booking-row">
          <div class="booking-field">
            <label>Type of Service Requested <span class="req">*</span></label>
            <input name="Type of Service" type="text" placeholder="What do you need help with?" required>
          </div>
        </div>
        <button type="submit" id="booking-submit">Submit</button>
        <span id="booking-smile">=)</span>
      </form>
    </div>
  </div>

  <script>

    document.getElementById("booking-open").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("booking-overlay").classList.add("open");
    });
    document.getElementById("booking-close").addEventListener("click", () => {
      document.getElementById("booking-overlay").classList.remove("open");
    });
    document.getElementById("booking-overlay").addEventListener("click", (e) => {
      if (e.target.id === "booking-overlay") {
        document.getElementById("booking-overlay").classList.remove("open");
      }
    });
    document.getElementById("booking-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = document.getElementById("booking-submit");
      btn.disabled = true;
      btn.textContent = "Sending...";
      try {
        const data = new FormData(form);
        data.append("_subject", "New appointment request");
        data.append("_captcha", "false");
        const res = await fetch("https://formsubmit.co/ajax/michaelsimon0098@gmail.com", {
          method: "POST",
          headers: { "Accept": "application/json" },
          body: data
        });
        if (!res.ok) throw new Error("Request failed");
        alert("Thanks! Your appointment request has been sent.");
        form.reset();
        document.getElementById("booking-overlay").classList.remove("open");
      } catch (err) {
        alert("Sorry, something went wrong. Please try again.");
      }
      btn.disabled = false;
      btn.textContent = "Submit";
    });

    // Fit the picture to the window height. Never scale up (max 1).
    function fitToScreen() {
      const narrow = window.innerWidth <= 800;
      const k = narrow ? 1 : Math.min(1, window.innerHeight / 1808);
      document.documentElement.style.setProperty("--s", k);
      const pt = document.getElementById("px");
      if (pt) pt.setAttribute("patternTransform", "scale(" + k + ")");
    }
    fitToScreen();
    window.addEventListener("resize", fitToScreen);

    window.addEventListener("load", () => {
      // --- Matrix rain background ---
      const canvas = document.getElementById("matrix-rain");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const glyphs = "日ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ0123456789✦✧⟡◇☆★";
      const fontSize = 18;
      let rows = Math.ceil(canvas.height / fontSize);
      // Stagger the starting rows so columns don't all fall in one line
      const drops = Array.from({ length: Math.floor(canvas.width / fontSize) }, () => Math.floor(Math.random() * rows * 0.3));

      // Keep the rain sized to the window
      window.addEventListener("resize", () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        rows = Math.ceil(canvas.height / fontSize);
        const cols = Math.floor(canvas.width / fontSize);
        while (drops.length < cols) drops.push(Math.floor(Math.random() * rows));
        drops.length = cols;
      });

      function stepRain() {
        ctx.fillStyle = "rgba(10, 10, 10, 0.08)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#33ff99";
        ctx.font = fontSize + "px monospace";

        for (let i = 0; i < drops.length; i++) {
          const text = glyphs[Math.floor(Math.random() * glyphs.length)];
          ctx.fillText(text, i * fontSize, drops[i] * fontSize);

          if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        }
      }

      // Pre-run the rain so it already reaches the bottom of the screen
      // on the very first frame (no matter how tall the window is)
      for (let k = 0; k < rows + 40; k++) stepRain();

      function drawRain() {
        stepRain();
        requestAnimationFrame(drawRain);
      }
      drawRain();

      // --- Braille spinner ---
      const spinnerFrames = ["⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"];
      const spinnerMessages = [
        "initializing", "loading assets", "mixing colors",
        "priming confetti", "warming up", "almost there"
      ];
      let frame = 0;
      const spinnerLine = document.getElementById("spinner-line");

      const spinnerInterval = setInterval(() => {
        const glyph = spinnerFrames[frame % spinnerFrames.length];
        const msg = spinnerMessages[Math.floor(frame / 8) % spinnerMessages.length];
        spinnerLine.textContent = `${glyph} ${msg}`;
        frame++;
      }, 80);

      // --- Progress bar (terminal style) ---
      let i = 0;
      const bar = document.getElementById("progress-bar");
      const barWidth = Math.max(30, Math.min(80, Math.floor(window.innerWidth / 16)));

      const interval = setInterval(() => {
        const filled = "█".repeat(Math.floor((i / 100) * barWidth));
        const empty = "░".repeat(barWidth - Math.floor((i / 100) * barWidth));
        bar.textContent = `[${filled}${empty}] ${i}%`;

        if (i >= 100) {
          clearInterval(interval);
          clearInterval(spinnerInterval);
          setTimeout(() => {
            document.getElementById("loading-screen").classList.add("hidden");
            document.getElementById("content").classList.add("visible");
          }, 200);
        }

        i++;
      }, 10);
    });

  </script>
